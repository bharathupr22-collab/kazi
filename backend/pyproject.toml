[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "kazi-backend"
version = "0.1.0"
description = "Kazi private productivity API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<0.163",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.54,<0.55",
  "pymongo>=4.12,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<0.29",
  "tzdata>=2025.1,<2027",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "mongomock>=4.3,<5", "pip-audit>=2.10,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
