# Local development only: the database is not configured with authentication/TLS.
# Do not expose it publicly. See docs/deployment.md for production requirements.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo_data:
